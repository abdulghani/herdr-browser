<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
  <title>Settings</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>Settings</h1>

    <section>
      <h2>DNS</h2>
      <p class="hint">Which server the browser asks to turn site names into addresses. The servers other
        than the system default use DNS over HTTPS: lookups are encrypted, so your network can't see or
        change which sites you look up.</p>
      <form id="dns-form">
        <div id="dns-providers"></div>
        <label id="custom-row" hidden>
          <span>Server address</span>
          <input id="custom-url" type="url" spellcheck="false" autocomplete="off" placeholder="https://dns.example.com/dns-query">
        </label>
        <div class="actions">
          <button type="submit" id="dns-save">Save</button>
          <span id="dns-status" role="status"></span>
        </div>
      </form>

      <h3>Test a lookup</h3>
      <form id="resolve-form" class="row">
        <input id="resolve-host" spellcheck="false" autocomplete="off" placeholder="example.com" value="example.com">
        <button type="submit">Look up</button>
      </form>
      <ul id="resolve-result"></ul>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
