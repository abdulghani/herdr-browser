# TEMPORARY: runs the release workflow's build steps without bumping or publishing.
name: Release dry run

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: node -v && npm -v

      - run: npm ci

      - run: npm run build:ui

      - run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Check the built apps report the package.json version
        run: |
          node -e '
            const asar = require("@electron/asar");
            const { globSync } = require("node:fs");
            const want = require("./package.json").version;
            const apps = globSync("dist/**/app.asar");
            if (!apps.length) throw new Error("No app.asar found in dist/");
            for (const app of apps) {
              const got = JSON.parse(asar.extractFile(app, "package.json")).version;
              console.log(app + ": " + got);
              if (got !== want) throw new Error(app + " reports " + got);
            }
          '

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  download:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: ls -la artifacts/app-*/*
