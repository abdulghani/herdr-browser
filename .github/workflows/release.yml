# When a pull request that changes the app's source (src/) or CHANGELOG.md is merged into main,
# bump the version, add the merged pull requests to CHANGELOG.md, build the Mac and Linux apps
# and publish them as a GitHub release. Nothing is released unless src/ (apart from tests) or
# CHANGELOG.md changed since the last release, also when run by hand.
#
# The version goes up by a patch (0.3.0 -> 0.3.1) unless the pull request has one of these labels:
#   release:minor   0.3.0 -> 0.4.0
#   release:major   0.3.0 -> 1.0.0
#   skip-release    no release at all
#
# It can also be run by hand from the Actions tab ("Run workflow"), picking the bump there.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
    # Tests and test helpers live in src/ too, but don't ship, so they don't make a release.
    paths:
      - 'src/**'
      - '!src/**/*.test.js'
      - '!src/testing/**'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, in the order the pull requests were merged.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Is there anything to release since the last release?
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare with the last release
        id: diff
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*')"
          files=(src CHANGELOG.md ':(exclude,glob)src/**/*.test.js' ':(exclude)src/testing')
          if git diff --quiet "$previous" HEAD -- "${files[@]}"; then
            echo "::notice::Nothing in src/ or CHANGELOG.md changed since $previous, so there's nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$previous" HEAD -- "${files[@]}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version
        id: version
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BUMP: ${{ inputs.bump }}
        run: |
          bump="${BUMP:-patch}"
          if echo "$LABELS" | grep -q '"release:major"'; then bump="major"
          elif echo "$LABELS" | grep -q '"release:minor"'; then bump="minor"
          fi
          npm version "$bump" --no-git-tag-version
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$(git describe --tags --abbrev=0 --match 'v*')" >> "$GITHUB_OUTPUT"

      - name: Write release notes and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish=main -f previous_tag_name="$PREVIOUS" \
            --jq .body > notes.md
          # Notes written by hand under "## Unreleased" go into this release, above GitHub's list
          # of merged pull requests, and the Unreleased section starts over empty.
          touch CHANGELOG.md
          unreleased="$(awk '/^## Unreleased/ { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed '/./,$!d')"
          older="$(awk '/^# Changelog/ { next } /^## Unreleased/ { skip = 1; next } /^## / { skip = 0 } !skip' CHANGELOG.md | sed '/./,$!d')"
          {
            if [ -n "$unreleased" ]; then
              echo "$unreleased"
              echo
            fi
            # GitHub's notes start with a "What's Changed" heading; the version heading replaces it.
            grep -v "^## What's Changed" notes.md
          } > release-notes.md
          mv release-notes.md notes.md
          {
            echo "# Changelog"
            echo
            echo "## Unreleased"
            echo
            echo "## $TAG ($(date -u +%Y-%m-%d))"
            echo
            cat notes.md
            echo
            [ -n "$older" ] && echo "$older"
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release ${TAG#v}"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

  build:
    needs: bump
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The pages (src/ui) are built into dist-ui/, which the app loads.
      - run: npm run build:ui

      - run: npx electron-builder ${{ matrix.args }} --publish never

      # The About tab in settings shows the version from the app's package.json; make sure every
      # build carries the new one before it's published.
      - name: Check the built apps report the new version
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          # shellcheck disable=SC2016 # the ${...} below is JavaScript, not shell
          node -e '
            const asar = require("@electron/asar");
            const { globSync } = require("node:fs");
            const want = process.env.TAG.replace(/^v/, "");
            const apps = globSync("dist/**/app.asar");
            if (!apps.length) throw new Error("No app.asar found in dist/");
            for (const app of apps) {
              const got = JSON.parse(asar.extractFile(app, "package.json")).version;
              console.log(`${app}: ${got}`);
              if (got !== want) throw new Error(`${app} reports ${got}, expected ${want}`);
            }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          {
            cat artifacts/notes/notes.md
            echo
            echo "## Install"
            echo
            echo "**macOS:** download \`HerdrBrowser-${TAG#v}-arm64.dmg\` (Apple Silicon) or \`HerdrBrowser-${TAG#v}-x64.dmg\` (Intel), open it and drag Herdr Browser to Applications. The app isn't notarized, so the first time macOS blocks it: open System Settings → Privacy & Security and click **Open Anyway**."
            echo
            echo "**Linux:** download the \`.AppImage\`, make it executable (\`chmod +x\`) and run it."
          } > body.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Herdr Browser ${TAG#v}" \
            --notes-file body.md artifacts/app-*/*
