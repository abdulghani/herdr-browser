# Lint, format check, unused code check (knip), unit tests with coverage and the UI build on every
# pull request.
# One job installs the dependencies and caches node_modules under a hash of package-lock.json;
# each check then runs in its own job from that cache.
name: Checks

on:
  pull_request:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          # Same OS, Node version (.nvmrc) and lockfile -> same node_modules.
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  check:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint
          - name: Formatting
            run: npm run format:check
          # Knip loads vite.config.mjs, which needs the Electrobun devkit (see Build UI).
          - name: Knip
            run: npx electrobun prepare && npm run knip
          # Fails if coverage of src/ drops below 80% (vitest.config.mjs).
          - name: Unit tests
            run: npm run test:coverage
          # The pages (src/ui, Svelte + Tailwind) build with Vite. They import Electrobun's page API
          # (electrobun/view), which comes from the devkit `electrobun prepare` sets up in .hutch/.
          - name: Build UI
            run: npx electrobun prepare && npm run build:ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          # Same OS, Node version (.nvmrc) and lockfile -> same node_modules.
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
